services:
  db:
    image: postgres:16-alpine
    container_name: saldo_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: saldo
      POSTGRES_PASSWORD: saldo
      POSTGRES_DB: saldo
    ports:
      - "5432:5432"
    volumes:
      - saldo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saldo -d saldo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  saldo_pgdata:
